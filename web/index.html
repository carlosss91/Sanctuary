<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sanctuary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Sanctuary · Plataforma Integral</title>
  <link rel="manifest" href="manifest.json">

  <!-- PDF.js for Web PDF Rendering & Text Extraction (required for GitHub Pages & Printing.raster) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <!-- Tesseract.js for Browser-based Client-side OCR on GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script type="text/javascript">
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }

    window.extractPdfTextFromBase64 = async function(base64Data) {
      try {
        if (typeof pdfjsLib === 'undefined') {
          console.warn('[Sanctuary] pdfjsLib is not defined, cannot extract PDF text on web.');
          return '';
        }
        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const loadingTask = pdfjsLib.getDocument({
          data: bytes,
          cMapUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/cmaps/",
          cMapPacked: true,
          standardFontDataUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/standard_fonts/"
        });
        const pdf = await loadingTask.promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          let lastY = null;
          let pageText = '';
          for (const item of textContent.items) {
            if (!item || typeof item.str !== 'string') continue;
            const str = item.str;
            if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
              pageText += '\n';
            } else if (str.trim().length > 0 && pageText.length > 0 && !pageText.endsWith(' ') && !pageText.endsWith('\n')) {
              pageText += ' ';
            }
            pageText += str;
            if (item.hasEOL) {
              pageText += '\n';
            }
            if (str.trim().length > 0) {
              lastY = item.transform[5];
            }
          }
          fullText += pageText + '\n\n';
        }

        // OCR Fallback with Tesseract.js if text extraction yielded very sparse text (< 60 chars)
        if (fullText.trim().length < 60 && typeof Tesseract !== 'undefined') {
          console.log('[Sanctuary] Texto escaso extraído con PDF.js (' + fullText.trim().length + ' chars). Iniciando OCR con Tesseract.js...');
          let ocrFullText = '';
          for (let i = 1; i <= Math.min(pdf.numPages, 3); i++) {
            try {
              const page = await pdf.getPage(i);
              const viewport = page.getViewport({ scale: 2.0 });
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              const ctx = canvas.getContext('2d');
              await page.render({ canvasContext: ctx, viewport: viewport }).promise;
              const ocrRes = await Tesseract.recognize(canvas, 'spa+eng');
              if (ocrRes && ocrRes.data && ocrRes.data.text) {
                ocrFullText += ocrRes.data.text + '\n\n';
              }
            } catch (ocrErr) {
              console.warn('[Sanctuary] Error en OCR de página ' + i + ':', ocrErr);
            }
          }
          if (ocrFullText.trim().length > fullText.trim().length) {
            fullText = ocrFullText;
          }
        }

        console.log('[Sanctuary] PDF text extraction completed. Characters extracted:', fullText.length);
        return fullText;
      } catch (err) {
        console.error('[Sanctuary] Error extracting text from PDF with pdf.js:', err);
        return '';
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
